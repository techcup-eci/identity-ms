# Server
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:TechCupSecretKey2024DefaultOnlyForDev}
jwt.expiration=${JWT_EXPIRATION:36000000}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techcup_identity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.escuelaing.techcup=INFO

# Para eliminar el warning de logs
spring.jpa.open-in-view=false

# Otros Microservicios
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
