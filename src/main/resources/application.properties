# Server
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:TechCupSecretKey2026DefaultOnlyForDev}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/techcup_identity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.escuelaing.techcup=INFO

# Para eliminar el warning de logs
spring.jpa.open-in-view=false

# Otros Microservicios
services.user-service.url=${USER_SERVICE_URL:http://localhost:8082}

# SpringDoc OpenAPI — Swagger UI
springdoc.api-docs.path=/api/identity/v3/api-docs
springdoc.swagger-ui.path=/api/identity/swagger-ui.html
springdoc.packages-to-scan=com.escuelaing.techcup.controller
springdoc.swagger-ui.operationsSorter=method

# Admin default password (for DataInitializer)
admin.default.password=${ADMIN_DEFAULT_PASSWORD:Admin1234!}

# Gateway URL — toda comunicación entre microservicios pasa por aquí
services.gateway.url=${API_GATEWAY_URL:http://localhost:8081}

# Internal secret — para comunicación entre microservicios a través del gateway
app.internal.secret=${INTERNAL_SECRET:techcup-internal-secret-dev}




