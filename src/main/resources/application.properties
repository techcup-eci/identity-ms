# Server
server.port=${PORT:8081}

# JWT
app.jwt.secret=${JWT_SECRET:TechCupSecretKey2026DefaultOnlyForDev}
app.jwt.expiration=${JWT_EXPIRATION:36000000}

admin.default.password=${ADMIN_PASSWORD:admin123}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techcup_identity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.escuelaing.techcup=INFO

spring.jpa.open-in-view=false

# Otros Microservicios
services.api-gateway.url=${API_GATEWAY_URL:http://localhost:8080}

# Seguridad interna gateway-ms
internal.secret=${INTERNAL_SECRET:techcup-internal-secret-dev}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true