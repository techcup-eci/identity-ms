# Server
server.port=8081

# JWT (mismo JWT_SECRET que orchestrator: app.jwt.secret)
jwt.secret=${JWT_SECRET:TechCupSecretKey2024DefaultOnlyForDev}
jwt.expiration=${JWT_EXPIRATION:36000000}

# Database (H2 for development, PostgreSQL for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:techcup_identity}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.escuelaing.techcup=INFO

# Para eliminar el warning de logs
spring.jpa.open-in-view=false

# Otros Microservicios
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
