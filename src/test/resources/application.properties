# Server
server.port=8081
# JWT
jwt.secret=test-secret-key-for-ci-only-2024-minimum-256bits
jwt.expiration=900000
jwt.refresh-expiration=604800000
# H2 en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Logging
logging.level.org.springframework.security=WARN
logging.level.com.escuelaing.techcup=INFO
# Admin
admin.default.password=admin123
# Otros Microservicios
services.user-service.url=http://localhost:9999
services.gateway.url=http://localhost:8080
# SpringDoc
springdoc.api-docs.path=/api/auth/v3/api-docs
springdoc.swagger-ui.path=/api/auth/swagger-ui.html
springdoc.packages-to-scan=com.escuelaing.techcup.controller
springdoc.swagger-ui.operationsSorter=method