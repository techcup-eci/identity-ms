name: CI/CD — identity-service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-techcup
  CONTAINER_APP_ENV: cae-techcup
  CONTAINER_APP_NAME: identity-service
  ACR_NAME: acrtechcup
  IMAGE_NAME: identity-service
  JAVA_VERSION: '17'

jobs:

  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Calidad — pruebas + cobertura JaCoCo
  # ─────────────────────────────────────────────────────────────────
  quality:
    name: Calidad del código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Pruebas y cobertura
        run: mvn verify --batch-mode --no-transfer-progress

      - name: Publicar reporte de cobertura
        uses: Madrapps/jacoco-report@v1.6.1
        if: always()
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: 'Cobertura — identity-service'

      - name: Subir reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Deploy — solo si quality pasó y es push a main
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy a Azure Container Apps
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login en ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          pull: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy en Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENV }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          targetPort: 8081
          ingress: external

      - name: Obtener URL del servicio
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "identity-service desplegado en: https://$URL"